  <circle cx="50" cy="50" r="46.5" stroke="#64FFDA" stroke-width="3"/>
  
  <!-- Left stem of E -->
  <rect x="28" y="27" width="5.5" height="34" fill="#072E68"/>
  
  <!-- Top bar of E with diagonal cut -->
  <path d="M33.5 27H48L52.5 32H33.5V27Z" fill="#072E68"/>
  
  <!-- Bottom bar of E with diagonal cut -->
  <path d="M33.5 56H48.5L44 61H33.5V56Z" fill="#072E68"/>
  
  <!-- Mint Waveform in the center -->
  <rect x="34.5" y="42" width="2" height="4" rx="1" fill="#64FFDA"/>
  <rect x="38" y="40.5" width="2" height="7" rx="1" fill="#64FFDA"/>
  <rect x="41.5" y="37" width="2" height="14" rx="1" fill="#64FFDA"/>
  <rect x="45" y="40.5" width="2" height="7" rx="1" fill="#64FFDA"/>
  <rect x="48.5" y="42" width="2" height="4" rx="1" fill="#64FFDA"/>

